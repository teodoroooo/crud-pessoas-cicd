name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  analise-estatica:
    name: Análise estática e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - name: Cobertura total
        run: npm test

  imagem-docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [analise-estatica, testes-unitarios, testes-integracao]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Build da imagem
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Teste de fumaça do container
        run: |
          docker run -d --name app -p 3000:3000 $IMAGE_NAME:${{ github.sha }}
          for i in $(seq 1 15); do curl -fs http://localhost:3000/health && break; sleep 1; done
          curl -fs -X POST http://localhost:3000/pessoas \
            -H 'Content-Type: application/json' \
            -d '{"cpf":"529.982.247-25","nome":"Maria Silva","dataNascimento":"2000-01-15"}'
          echo
          curl -fs http://localhost:3000/pessoas
          docker rm -f app

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publica a imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
