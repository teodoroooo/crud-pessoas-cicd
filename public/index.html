<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro de Pessoas</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; color: #1f2933; }
      main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
      h1 { margin: 0 0 4px; }
      .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-top: 20px; }
      form { display: grid; grid-template-columns: 1fr 2fr 1fr auto; gap: 10px; align-items: end; }
      label { display: flex; flex-direction: column; font-size: 13px; gap: 4px; }
      input { padding: 8px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 14px; }
      button { padding: 9px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
      button.sec { background: #e4e7eb; color: #1f2933; }
      button.del { background: #dc2626; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e4e7eb; }
      #msg { min-height: 20px; margin-top: 10px; font-size: 14px; }
      .erro { color: #dc2626; } .ok { color: #15803d; }
      @media (max-width: 640px) { form { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Cadastro de Pessoas</h1>
      <p>CRUD de CPF, nome e data de nascimento com cálculo automático da idade.</p>
      <section class="card">
        <form id="form">
          <label>CPF <input id="cpf" required placeholder="000.000.000-00" /></label>
          <label>Nome <input id="nome" required placeholder="Nome completo" /></label>
          <label>Nascimento <input id="dataNascimento" type="date" required /></label>
          <div>
            <button type="submit" id="salvar">Cadastrar</button>
            <button type="button" class="sec" id="cancelar" hidden>Cancelar</button>
          </div>
        </form>
        <div id="msg"></div>
      </section>
      <section class="card">
        <table>
          <thead>
            <tr><th>CPF</th><th>Nome</th><th>Nascimento</th><th>Idade</th><th></th></tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
